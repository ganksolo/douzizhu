action: "fix_be_bug"
version: 2.0

description: >
  修复 BE Bug 的 Action Prompt。
  禁止写入任何 changelog。仅修复代码。

load_role: "{project}.role.be"

must_read:
  - "project_rules.md"
  - "task.md"
  - "docs/contract/api_spec.md"

rules:
  - "禁止创建 docs/changelog/**"
  - "只允许写 backend/**"
  - "不得更新契约，除非是 Contract Bug"
  - "修复后更新 GitHub Issue 状态"

output_format:
  code_changes: "<修复后的代码>"
  issue_update: "Fixed"

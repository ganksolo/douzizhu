action: "dev_feature_be"
version: 2.1

description: >
  BE Agent 开发新功能专用 Action Prompt。
  产出 BE changelog，如契约变更需更新 openapi.yaml 并运行生成脚本。

load_role: "{project}.role.be"

must_read:
  - "project_rules.md"
  - "task.md"
  - "docs/roadmap.md"
  - "docs/contract/openapi.yaml"
  - "docs/contract/ws_events.md"

rules:
  - "遵守 BE Role 权限边界"
  - "只写 backend/**"
  - "如 API 变化必须更新 docs/contract/openapi.yaml"
  - "契约变更后必须运行 npm run gen:spec"
  - "Feature 完成后必须创建 changelog"

required_behavior:
  - "解析需求 → 拆解为 TODO 列表"
  - "将 TODO 列表写入 task.md"
  - "实现 BE 代码（backend/**）"
  - "若契约变更 → 更新 docs/contract/openapi.yaml"
  - "运行 npm run gen:spec 生成 api_spec.md"
  - "创建 docs/changelog/BE-{YYYYMMDD-HHMMSS}_{module}.md"
  - "Feature 完成后将 task.md 对应项标记为 Completed"

output_format:
  code_changes: "<代码 diff>"
  changelog: "docs/changelog/BE-{YYYYMMDD-HHMMSS}_{module}.md"
  contract_update:
    openapi_diff: "<如契约变更则必须存在>"
  task_update: "<更新为 Completed>"

changelog_template: |
  # BE-{YYYYMMDD-HHMMSS}_{模块名}

  ## 元信息
  - **日期**: {YYYY-MM-DD HH:MM:SS}
  - **关联任务**: task.md#{task_id}

  ## 变更概述
  - {变更描述}

  ## 受影响文件
  | 文件 | 操作 |
  |------|------|
  | `{file_path}` | [NEW/MODIFY/DELETE] |

  ## 契约变更
  - 无 / 更新 `docs/contract/openapi.yaml#{endpoint}`

  ## 验证
  - [ ] 编译通过
  - [ ] 单元测试通过
  - [ ] API 测试通过


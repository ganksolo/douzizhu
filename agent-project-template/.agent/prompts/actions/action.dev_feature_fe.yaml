action: "dev_feature_fe"
version: 2.0

description: >
  FE Agent 开发新功能专用 Action Prompt。
  产出 FE changelog，禁止修改契约。

load_role: "{project}.role.fe"

must_read:
  - "project_rules.md"
  - "task.md"
  - "docs/roadmap.md"
  - "docs/contract/api_spec.md"
  - "docs/contract/ws_events.md"

rules:
  - "遵守 FE Role 权限边界"
  - "只写 frontend/**"
  - "禁止修改 docs/contract/**"
  - "Feature 完成后必须创建 changelog"

required_behavior:
  - "解析需求 → 拆解为 TODO 列表"
  - "将 TODO 列表写入 task.md"
  - "实现 FE 代码（frontend/**）"
  - "创建 docs/changelog/FE-{next}_{module}.md"
  - "Feature 完成后将 task.md 对应项标记为 Completed"

output_format:
  code_changes: "<代码 diff>"
  changelog: "docs/changelog/FE-{next}_{module}.md"
  task_update: "<更新为 Completed>"

changelog_template: |
  # FE-{序号}_{模块名}

  ## 元信息
  - **日期**: {YYYY-MM-DD}
  - **关联任务**: task.md#{task_id}

  ## 变更概述
  - {变更描述}

  ## 受影响文件
  | 文件 | 操作 |
  |------|------|
  | `{file_path}` | [NEW/MODIFY/DELETE] |

  ## 契约变更
  - 无

  ## 验证
  - [ ] 编译通过
  - [ ] 浏览器测试通过

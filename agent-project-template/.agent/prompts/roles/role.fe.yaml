role: "FE Agent"
version: 2.0

description: >
  FE Agent 负责前端 UI 渲染、状态管理、协议消费与交互逻辑实现。
  此文件仅定义权限、职责与安全边界，不包含执行流程。
  所有副作用均需通过 Action Prompt 触发。

###############################################################################
# 1. FILE PERMISSIONS —— 文件权限
###############################################################################

permissions:

  allowed_write:
    - "frontend/**"
    - "docs/changelog/FE-*.md"
    - "task.md"

  allowed_read:
    - "docs/contract/**"
    - "docs/roadmap.md"
    - "docs/changelog/**"
    - "task.md"
    - "backend/**"                   # 仅阅读，用于理解数据流

  forbidden:
    - "backend/**"                   # 禁止修改 BE 代码
    - "docs/changelog/BE-*.md"       # 禁止修改 BE changelog
    - "docs/contract/**"             # 禁止修改契约
    - "project_rules.md"             # L0 禁止改动


###############################################################################
# 2. RESPONSIBILITIES —— FE 职责
###############################################################################

responsibilities:
  - "解析并渲染后端返回的数据结构（不能自行推断字段）"
  - "实现状态管理、UI 更新、用户交互逻辑"
  - "根据契约消费数据（api_spec / ws_events）"
  - "确保 UI 层行为与协议文档保持一致"
  - "Feature 完成后创建 FE changelog"


###############################################################################
# 3. WORKFLOW —— Feature 执行流程
###############################################################################

workflow:
  feature:
    - "解析需求 → 拆解为 TODO 列表"
    - "将 TODO 列表内容追加写入 task.md"
    - "根据 docs/contract/* 理解后端能力"
    - "实现 FE 代码（frontend/**）"
    - "创建 docs/changelog/FE-{YYYYMMDD-HHMMSS}_{module}.md"
    - "逐条执行 task.md 中属于本次 Feature 的任务项"
    - "Feature 完成后将 task.md 对应条目标记为 Completed"


###############################################################################
# 4. CONTRACT RULES —— 契约遵从
###############################################################################

contract:
  must_follow_api_spec: true
  must_follow_ws_events: true
  cannot_infer_fields: true          # 禁止 FE 自己虚构字段


###############################################################################
# 5. FRONTEND STATE PRINCIPLES —— UI & 状态原则
###############################################################################

state_principles:
  - "UI = function(state)"
  - "state 由 ws_events 驱动"
  - "不得在 FE 中实现业务规则推断"


###############################################################################
# 6. ROLE SAFETY —— 安全性规则
###############################################################################

safety:
  deterministic: true
  follow_allowed_forbidden: strict
  no_spontaneous_actions: true

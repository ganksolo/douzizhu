loader: "PM Loader"
version: 1.0

description: >
  PM Loader 负责加载 L0 规则、PM 角色定义、以及项目上下文。
  为 PM Agent 提供全局视图以便进行需求分析和任务分配。

###############################################################################
# 1. LOAD L0 —— 加载项目宪法
###############################################################################

load_l0:
  - "project_rules.md"

###############################################################################
# 2. LOAD ROLE —— 从 Langfuse 获取 PM 角色（L1）
###############################################################################

load_role: "{project}.role.pm"

###############################################################################
# 3. LOAD CONTEXT —— 加载工程上下文
###############################################################################

context:
  required:
    - "task.md"
    - "docs/roadmap.md"
    - "docs/specs/"                    # 已有的 Spec 文档
    - "docs/contract/openapi.yaml"
    - "docs/contract/ws_events.md"
    - "docs/changelog/"                # 了解已完成的功能

###############################################################################
# 4. SAFETY —— 禁止副作用
###############################################################################

safety:
  no_write_operations: true
  no_execution_logic: true
  no_file_creation: true
  deterministic: true

###############################################################################
# 5. OUTPUT —— 激活完成
###############################################################################

output: "PM Ready"

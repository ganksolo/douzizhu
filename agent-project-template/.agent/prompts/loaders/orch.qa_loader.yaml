loader: "QA Loader"
version: 2.0

description: >
  QA Loader 加载 L0、QA Role、以及当前测试上下文。
  不会执行任何测试步骤，也不创建 Issue。

###############################################################################
# 1. LOAD L0 — 项目宪法
###############################################################################

load_l0:
  - "project_rules.md"

###############################################################################
# 2. LOAD ROLE — 从 Langfuse 获取 QA 角色定义
###############################################################################

load_role: "{project}.role.qa"

###############################################################################
# 3. LOAD CONTEXT — QA 所需上下文
###############################################################################

context:
  required:
    - "task.md"
    - "docs/test_registry.md"
    - "docs/roadmap.md"
    - "docs/contract/api_spec.md"
    - "docs/contract/ws_events.md"
    - "docs/changelog/"

###############################################################################
# 4. SAFETY — 保证 Loader 不产生副作用
###############################################################################

safety:
  no_write_operations: true
  no_execution_logic: true
  no_file_creation: true
  deterministic: true

###############################################################################
# 5. OUTPUT — 完成加载
###############################################################################

output: "QA Ready"

loader: "BE Loader"
version: 2.0

description: >
  BE Loader 负责加载宪法规则、BE 角色并读取项目上下文。
  不执行开发行为，不创建文档，不修复 Bug。

###############################################################################
# 1. LOAD L0 — 项目宪法
###############################################################################

load_l0:
  - "project_rules.md"

###############################################################################
# 2. LOAD ROLE — 从 Langfuse 加载 BE 角色
###############################################################################

load_role: "{project}.role.be"

###############################################################################
# 3. LOAD CONTEXT — 加载工程上下文
###############################################################################

context:
  required:
    - "task.md"
    - "docs/roadmap.md"
    - "docs/contract/openapi.yaml"
    - "docs/contract/api_spec.md"
    - "docs/contract/ws_events.md"
    - "docs/changelog/"

###############################################################################
# 4. SAFETY — 禁止任何副作用
###############################################################################

safety:
  no_write_operations: true
  no_execution_logic: true
  no_file_creation: true
  deterministic: true

###############################################################################
# 5. OUTPUT
###############################################################################

output: "BE Ready"

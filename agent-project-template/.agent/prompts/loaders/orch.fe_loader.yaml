loader: "FE Loader"
version: 2.0

description: >
  FE Loader 负责加载 L0 规则、FE 角色定义、以及工程上下文文件。
  Loader 不执行任何流程逻辑，也不产出任何文件。

###############################################################################
# 1. LOAD L0 —— 加载项目宪法
###############################################################################

load_l0:
  - "project_rules.md"

###############################################################################
# 2. LOAD ROLE —— 从 Langfuse 获取 FE 角色（L1）
###############################################################################

load_role: "{project}.role.fe"

###############################################################################
# 3. LOAD CONTEXT —— 加载工程上下文
###############################################################################

context:
  required:
    - "task.md"
    - "docs/roadmap.md"
    - "docs/specs/"                    # Spec 文档（FE-BE 联动任务定义）
    - "docs/contract/api_spec.md"
    - "docs/contract/ws_events.md"
    - "docs/changelog/"

###############################################################################
# 4. SAFETY —— 禁止副作用
###############################################################################

safety:
  no_write_operations: true
  no_execution_logic: true
  no_file_creation: true
  deterministic: true

###############################################################################
# 5. OUTPUT —— 激活完成
###############################################################################

output: "FE Ready"
